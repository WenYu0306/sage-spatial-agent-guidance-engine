name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: sage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sage"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sage:sage@localhost:5432/sage
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret
      SEED_DEMO_ADMIN_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: lint（ruff + import-linter）
        run: |
          uv run ruff check packages deploy scripts
          uv run lint-imports
      - name: validate（M0 契约校验）
        run: uv run --package api-contract python packages/api-contract/scripts/validate.py
      - name: migrate + seed（真实表结构）
        run: |
          uv run alembic -c deploy/migrations/alembic.ini upgrade head
          uv run python deploy/seed/seed.py
          # pgvector 需灌向量；无 LLM_API_KEY 时 ingest 走 Mock 嵌入（provenance 断言仍可满足）
          uv run python -m knowledge_rag.ingest
      - name: M5 工具层禁直读（审计纪律：业务数据只能走 HTTP）
        run: |
          if grep -n "import psycopg" packages/agent-orchestrator/agent_orchestrator/tools.py; then
            echo "tools.py 出现 psycopg 直读——业务数据必须走 M8 HTTP"; exit 1
          fi
          echo "tools.py 零直读 ok"
      - name: pytest（含 DB/越权/幂等用例）
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # esbuild 二进制经 optionalDependencies 安装，无需 postinstall（与 Dockerfile.admin 同解）
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: node:test（map-render/admin-web/screen-web）
        run: pnpm -r --if-present test
      - name: typecheck（tsc --noEmit）
        run: |
          pnpm --filter @sage/map-render exec tsc --noEmit
          pnpm --filter @sage/admin-web exec tsc --noEmit
          pnpm --filter @sage/screen-web exec tsc --noEmit
      - name: eslint（跨包 import 边界）
        run: pnpm exec eslint packages/admin-web/src packages/map-render/src packages/screen-web/src
