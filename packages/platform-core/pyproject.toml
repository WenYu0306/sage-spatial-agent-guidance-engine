[project]
name = "platform-core"
version = "0.1.0"
description = "M1 多租户/RBAC/配置/日志trace/事件总线/埋点SDK（占位，US-001）"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2",
    "psycopg[binary]>=3.3.7",
    "pyjwt>=2.9",
    "redis>=5.2",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "platform_core"
