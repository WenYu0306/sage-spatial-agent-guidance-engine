[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "M5 LangGraph Agent 编排：意图/8工具/trace/SSE"
requires-python = ">=3.12"
dependencies = ["langgraph>=1.2", "langgraph-checkpoint-postgres>=3.2", "psycopg[binary]>=3.2", "fastapi>=0.162", "uvicorn>=0.54", "httpx>=0.28", "openai>=2.0"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "agent_orchestrator"
