[project]
name = "api-contract"
version = "0.1.0"
description = "M0 统一契约：统一响应体/错误码/事件 schema/请求头/分页 + 契约校验与代码生成"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "datamodel-code-generator>=0.28",
]

[build-system]
requires = ["uv_build>=0.13.7,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "api_contract"
