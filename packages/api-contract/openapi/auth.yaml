openapi: 3.1.0
info:
  title: M1 认证与 RBAC（auth）
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      summary: 登录（返回 access + refresh token）
      description: 凭证类失败统一 401 + error_code=1001，不区分原因（防用户枚举）；锁定期间正确口令同样 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_code, username, password]
              properties:
                tenant_code: { type: string, example: shanqueli-demo }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 7200, description: access 有效期秒数（2h） }
                  display_name: { type: string }
                  roles: { type: array, items: { type: string } }
                  venue_id: { type: integer, nullable: true }
        "401":
          description: 凭证无效/账号锁定
          content:
            application/json:
              schema:
              type: object
              required: [error_code, message]
              properties:
                error_code: { type: integer, example: 1001 }
                message: { type: string }
  /api/v1/auth/refresh:
    post:
      summary: 刷新 token（按库重查角色，旧 refresh 轮换作废）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 新 access + refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: refresh 无效/过期/已轮换
          content:
            application/json:
              schema:
              type: object
              required: [error_code, message]
              properties:
                error_code: { type: integer, example: 1001 }
                message: { type: string }
components:
  schemas:
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }
        display_name: { type: string }
        roles: { type: array, items: { type: string } }
        venue_id: { type: integer, nullable: true }
