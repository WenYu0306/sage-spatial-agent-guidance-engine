# Alembic 配置（deploy/migrations 是唯一改表入口，ARCHITECTURE 4.1 第 6 条）。
# 连接串不写在此处：env.py 从环境变量 DATABASE_URL 读取。
[alembic]
script_location = %(here)s
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
