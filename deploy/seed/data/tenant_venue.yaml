# 虚拟商场 demo 数据源（手册 7.2）。全部名称虚构——禁止真实商场/商户/促销信息。
# 主题名“山雀里/栖云/云雀”为虚构系列，与任何真实品牌无对应关系。
tenant:
  code: shanqueli-demo
  name: 山雀里商业管理集团
  plan: demo
  status: active
  settings:
    locale: zh-CN

venue:
  name: 山雀里·栖云广场
  venue_type: mall
  address: 虚构市云雀区栖枝街 88 号
  timezone: Asia/Shanghai
  status: active
  settings:
    business_hours: "10:00-22:00"
    welcome: 欢迎来到山雀里·栖云广场
    default_floor: F1

roles: [platform_admin, venue_admin, venue_editor, merchant, device]

# M1 演示账号：口令统一取 SEED_DEMO_ADMIN_PASSWORD（已存在账号不覆写口令）。
# venue_admin/venue_editor 绑定本场地；merchant 绑定 store 指定门店（pois.name）。
demo_accounts:
  - username: demo_admin
    display_name: 栖云广场运营演示账号
    role: venue_admin
  - username: demo_editor
    display_name: 栖云广场内容编辑
    role: venue_editor
  - username: demo_merchant
    display_name: 野莓茶集店主
    role: merchant
    store: 野莓茶集
  # M11 设备身份：大屏以 device 角色登录并心跳（绑定本场地 + screen-f1-01 同名设备）
  - username: screen-f1-01
    display_name: F1 中庭导览大屏（设备身份）
    role: device

# M1 演示设备：自然键 (tenant_id, code) upsert；坐标为 SVG 网格（与 POI 同系）。
devices:
  - code: screen-f1-01
    name: F1 中庭导览大屏
    device_type: screen
    floor: F1
    x: 600
    y: 400

floors:
  - name: B1
    level: -1
    elevation: -5.20
    is_default: false
    sort_order: 0
  - name: F1
    level: 1
    elevation: 0
    is_default: true
    sort_order: 1
  - name: F2
    level: 2
    elevation: 5.20
    is_default: false
    sort_order: 2

map_layers:
  B1: {svg_url: /static/maps/b1.svg, width: 1200, height: 800, scale_meter: 0.15}
  F1: {svg_url: /static/maps/f1.svg, width: 1200, height: 800, scale_meter: 0.15}
  F2: {svg_url: /static/maps/f2.svg, width: 1200, height: 800, scale_meter: 0.15}
