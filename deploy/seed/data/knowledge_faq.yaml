# FAQ 知识文档（15 篇，faq；与附录 B 评测问句 7/9/11/19/20 等对应）。
docs:
  - {doc_type: faq, title: 商场几点关门, content: "每天 10:00 开门、22:00 关门；影院最晚场次 22:30，B1 超市营业至 22:00。节假日以商场公告为准。"}
  - {doc_type: faq, title: 有免费 Wi-Fi 吗, content: "有免费 Wi-Fi，网络名 QiYun-Mall-Free，连接后短信验证即可使用，覆盖 B1 至 F2 公共区域。"}
  - {doc_type: faq, title: 可以带宠物吗, content: "除导盲犬等工作犬外，宠物不可入馆；B1 服务台旁有宠物临时寄存笼可免费使用。"}
  - {doc_type: faq, title: 停车怎么收费, content: "B1 停车场首小时 5 元、之后每小时 3 元，06:00-23:00 开放；单日消费满 100 元凭小票可免 2 小时停车费。"}
  - {doc_type: faq, title: 有母婴室吗, content: "有，F1 与 F2 层卫生间旁各有一间母婴室，配备换尿布台、独立哺乳间与温水，婴儿车可在 B1 服务台免费借用。"}
  - {doc_type: faq, title: 怎么注册会员, content: "到 F1 服务台或商场小程序注册即可，消费 1 元累计 1 积分，每月 8 日会员日双倍积分。"}
  - {doc_type: faq, title: 优惠券怎么用, content: "结账时在参与门店出示券码核销，每单限用一张，特价商品除外；过期券不可补发。"}
  - {doc_type: faq, title: 有储物柜吗, content: "F1 服务台提供行李寄存服务，小件每件每日 10 元；贵重物品请随身携带。"}
  - {doc_type: faq, title: 商场有多少家店, content: "山雀里·栖云广场目前共有 68 家店铺，另有 20 处公共服务设施，覆盖 B1、F1、F2 三层。"}
  - {doc_type: faq, title: 儿童走失怎么办, content: "请就近到任一楼层服务台求助，F1 服务台负责广播寻人并联动各楼层；母婴室与儿童乐园均在监控范围内。"}
  - {doc_type: faq, title: 可以借轮椅吗, content: "可以，F1 服务台提供轮椅免费借用，需押金 200 元；各层直梯均可到达目标楼层。"}
  - {doc_type: faq, title: 地铁怎么到商场, content: "地铁 2 号线栖云站 C 口出站，沿栖枝街步行约 5 分钟即到；公交 11 路、26 路至栖枝街站下车。"}
  - {doc_type: faq, title: 能开发票吗, content: "可以，店铺消费向所在门店索取电子发票；同日多张小票合并开票可到 F1 服务台办理。"}
  - {doc_type: faq, title: 影院周二有优惠吗, content: "有，巨幕星云影院每周二为半价日，全场影片半价（节假日与首映场除外）。"}
  - {doc_type: faq, title: 手机没电了怎么办, content: "F1 服务台可借共享充电宝；B1 停车场 A 口旁有新能源充电桩；B1 食光便利店也有充电宝租借。"}
