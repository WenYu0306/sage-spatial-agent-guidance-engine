# M13 demo nginx：前端静态 + API 分流；SSE 必须关缓冲（PRD 红线）。
# 只监听容器 80，由 compose 映射到 127.0.0.1:8080，外网统一走 caddy 反代。
# 审计 P1-2：限流区（conf.d 处于 http 上下文；SSE 长连接留足 burst）
limit_req_zone $binary_remote_addr zone=sage_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sage_agent:10m rate=2r/s;

server {
  # 审计 P1-2：安全响应头（HSTS 由宿主 caddy 在 HTTPS 层下发，此处不加）
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
  listen 80;
  server_name _;

  # 审查 R0/C18：运维与内部端点不公网裸奔（A6 升级处置）。
  # 内网消费方经 compose 网络直连服务端口，不经 nginx，不受影响。
  location = /api/v1/agent/stats { return 404; }
  location ^~ /api/v1/agent/sessions/ { return 404; }
  location = /recommend/rank { return 404; }

  # SSE 问答：关缓冲 + 长读超时（PRD 7.5 第 3 条）
  location /api/v1/agent/ {
    limit_req zone=sage_agent burst=12 nodelay;
    proxy_pass http://agent:8941;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Trace-Id $http_x_trace_id;
  }

  # 路线接力（F-11）：route_by_id 在 agent 服务上，不能落默认 /api/（→content 404）
  location /api/v1/route/ {
    proxy_pass http://agent:8941;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/v1/metrics {
    limit_req zone=sage_api burst=40 nodelay;
    proxy_pass http://analytics:8946;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/events {
    limit_req zone=sage_api burst=40 nodelay;
    proxy_pass http://analytics:8946;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /recommend/ {
    proxy_pass http://recommender:8944;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ {
    limit_req zone=sage_api burst=40 nodelay;
    proxy_pass http://content:8945;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
  }
  # 公网大屏与手机入口（作品集完整体验）
  location /screen/ {
    alias /usr/share/nginx/html/screen/;
    try_files $uri $uri/ /screen/index.html;
  }
  location /m/ {
    alias /usr/share/nginx/html/m/;
    try_files $uri $uri/ /m/index.html;
  }
  location = / {
    return 302 /admin/;
  }

  location /healthz {
    proxy_pass http://content:8945/health;
  }

  # M2：真实底图资产（map_layers.svg_url=/static/maps/*.svg 的服务端来源）
  # 必须在 server 块内——曾放在块外导致 nginx 运行时 emerg 拒启（P1 演练抓到）
  location /static/maps/ {
      alias /srv/sage-maps/;
  }
}
