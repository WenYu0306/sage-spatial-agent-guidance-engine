# M13 demo nginx：前端静态 + API 分流；SSE 必须关缓冲（PRD 红线）。
# 只监听容器 80，由 compose 映射到 127.0.0.1:8080，外网统一走 caddy 反代。
server {
  listen 80;
  server_name _;

  # SSE 问答：关缓冲 + 长读超时（PRD 7.5 第 3 条）
  location /api/v1/agent/ {
    proxy_pass http://agent:8941;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Trace-Id $http_x_trace_id;
  }

  location /api/v1/metrics {
    proxy_pass http://analytics:8946;
    proxy_set_header Host $host;
  }
  location /api/v1/events {
    proxy_pass http://analytics:8946;
    proxy_set_header Host $host;
  }
  location /recommend/ {
    proxy_pass http://recommender:8944;
    proxy_set_header Host $host;
  }
  location /api/ {
    proxy_pass http://content:8945;
    proxy_set_header Host $host;
  }

  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
  }
  location = / {
    return 302 /admin/;
  }

  location /healthz {
    proxy_pass http://content:8945/health;
  }
}
